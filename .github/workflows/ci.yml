name: CI Pipeline

on:
  push:
    branches: [main, master, staging, dev]
  pull_request:
    branches: [main, master]

jobs:
  backend-audit-and-tests:
    name: Backend Security & Flow Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run Backend Security & Edge-Cases Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_ci_jwt_secret_for_automated_testing_key_32chars
        run: npm test

  frontend-check:
    name: Frontend Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type Check & Build Validation
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npx tsc --noEmit
